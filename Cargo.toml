[package]
name = "drawme"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
dotenvy = "0.15"
pasetors = "0.8"
# Redis over TLS (`rediss://`), with bundled roots. The connection manager
# reconnects by itself, which a function instance that lives for a while needs.
redis = { version = "1.8", default-features = false, features = ["script", "tokio-rustls-comp", "tls-rustls-webpki-roots", "connection-manager"] }
# 0.12 runs rustls on ring with bundled roots. For Cloudflare's TURN API, and
# for the dev server's copy of jspaint from jsDelivr.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "fs"] }
tower = "0.5"
uuid = { version = "1", features = ["v4", "v5"] }
vercel_runtime = { version = "2.4", features = ["axum"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# The Vercel Function. Vercel builds each `api/*.rs` as its own binary, and
# `vercel.json` sends every `/api/*` request to this one.
[[bin]]
name = "server"
path = "api/server.rs"

# The page and the API on one local port, for development: `cargo run --bin dev`.
[[bin]]
name = "dev"
path = "src/bin/dev.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
